services:
  - type: web
    name: braille-converter
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app --timeout 120 --workers 1 --threads 2
    envVars:
      - key: RENDER
        value: true
      - key: LOW_MEMORY
        value: true
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: TRANSFORMERS_OFFLINE
        value: 1
      - key: TOKENIZERS_PARALLELISM
        value: false
      - key: TF_CPP_MIN_LOG_LEVEL
        value: 3
    plan: free
